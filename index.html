<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BPMN Studio — modelador visual de processos BPMN 2.0 direto no navegador. Crie, edite e exporte diagramas BPMN compatíveis com qualquer ferramenta." />
    <meta name="author" content="Guilherme Maciel" />
    <meta name="theme-color" content="#1f2937" />

    <title>BPMN Studio — Modelador BPMN 2.0 no navegador</title>

    <!-- Favicon placeholder (troque depois por um SVG próprio) -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />

    <!-- ============================================================
         CSS — ordem importa: reset → variáveis → layout → componentes → tema
         ============================================================ -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- ============================================================
         bpmn-js (CDN, versão fixada)
         - bpmn-modeler.development.js: bundle completo do modeler
         - diagram-js.css: estilos base do canvas
         - bpmn-js.css: estilos específicos de BPMN (paleta, context pad, etc.)
         ============================================================ -->
    <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/diagram-js.css" />
    <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/bpmn-js.css" />
    <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/bpmn-font/css/bpmn.css" />
</head>

<body>
    <!-- ============================================================
         APP SHELL
         ============================================================ -->
    <div id="app" class="app">

        <!-- ---------- TOOLBAR SUPERIOR ---------- -->
        <header class="toolbar" id="toolbar" role="banner">
            <div class="toolbar__brand">
                <span class="toolbar__logo" aria-hidden="true">◈</span>
                <span class="toolbar__title">BPMN Studio</span>
            </div>

            <nav class="toolbar__actions" aria-label="Ações do arquivo">
                <button type="button" class="btn" data-action="new" title="Novo diagrama (Ctrl+N)">
                    Novo
                </button>
                <button type="button" class="btn" data-action="open" title="Abrir arquivo BPMN (Ctrl+O)">
                    Abrir
                </button>
                <button type="button" class="btn" data-action="save" title="Salvar/exportar BPMN (Ctrl+S)">
                    Salvar
                </button>
                <button type="button" class="btn btn--primary" data-action="export" title="Exportar BPMN 2.0 XML">
                    Exportar BPMN
                </button>
            </nav>

            <!-- input escondido usado pelo botão "Abrir" -->
            <input
                type="file"
                id="file-input"
                accept=".bpmn,.bpmn20.xml,.xml,application/xml,text/xml"
                hidden
            />
        </header>

        <!-- ---------- CORPO PRINCIPAL ---------- -->
        <main class="workspace" role="main">

            <!-- ---------- SIDEBAR DE ELEMENTOS ---------- -->
            <aside class="sidebar" id="sidebar" aria-label="Elementos BPMN">
                <section class="sidebar__group">
                    <h2 class="sidebar__title">Eventos</h2>
                    <ul class="sidebar__list" data-group="events">
                        <li><button type="button" class="element-btn" data-element="bpmn:StartEvent">Início</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:IntermediateThrowEvent">Intermediário</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:EndEvent">Fim</button></li>
                    </ul>
                </section>

                <section class="sidebar__group">
                    <h2 class="sidebar__title">Tarefas</h2>
                    <ul class="sidebar__list" data-group="tasks">
                        <li><button type="button" class="element-btn" data-element="bpmn:Task">Tarefa</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:UserTask">Tarefa de Usuário</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:ServiceTask">Tarefa de Serviço</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:SubProcess">Subprocesso</button></li>
                    </ul>
                </section>

                <section class="sidebar__group">
                    <h2 class="sidebar__title">Gateways</h2>
                    <ul class="sidebar__list" data-group="gateways">
                        <li><button type="button" class="element-btn" data-element="bpmn:ExclusiveGateway">Exclusivo</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:ParallelGateway">Paralelo</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:InclusiveGateway">Inclusivo</button></li>
                    </ul>
                </section>

                <section class="sidebar__group">
                    <h2 class="sidebar__title">Conectores</h2>
                    <ul class="sidebar__list" data-group="connectors">
                        <li><button type="button" class="element-btn" data-element="bpmn:SequenceFlow">Sequence Flow</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:MessageFlow">Message Flow</button></li>
                    </ul>
                </section>

                <section class="sidebar__group">
                    <h2 class="sidebar__title">Outros</h2>
                    <ul class="sidebar__list" data-group="others">
                        <li><button type="button" class="element-btn" data-element="bpmn:Participant">Pool</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:Lane">Lane</button></li>
                        <li><button type="button" class="element-btn" data-element="bpmn:DataObjectReference">Data Object</button></li>
                    </ul>
                </section>
            </aside>

            <!-- ---------- ÁREA DE MODELAGEM ---------- -->
            <section class="canvas-wrap" aria-label="Área de modelagem">
                <div id="canvas" class="canvas"></div>
            </section>

            <!-- ---------- PAINEL DE PROPRIEDADES ---------- -->
            <aside class="properties" id="properties" aria-label="Propriedades">
                <h2 class="properties__title">Propriedades</h2>
                <div class="properties__body" id="properties-body">
                    <p class="properties__empty">Nenhum elemento selecionado.</p>
                </div>
            </aside>
        </main>

        <!-- ---------- PAINEL DE VALIDAÇÃO (oculto por padrão) ---------- -->
        <section class="validation" id="validation" aria-label="Validação BPMN" hidden>
            <header class="validation__header">
                <h2 class="validation__title">Validação BPMN</h2>
                <button type="button" class="btn btn--ghost" data-action="close-validation">Fechar</button>
            </header>
            <ul class="validation__list" id="validation-list"></ul>
        </section>

        <!-- ---------- STATUS BAR ---------- -->
        <footer class="statusbar" id="statusbar" role="contentinfo">
            <div class="statusbar__left">
                <button type="button" class="btn btn--icon" data-action="zoom-out" title="Zoom −">−</button>
                <span class="statusbar__zoom" id="zoom-level">100%</span>
                <button type="button" class="btn btn--icon" data-action="zoom-in" title="Zoom +">+</button>
                <button type="button" class="btn btn--icon" data-action="zoom-fit" title="Centralizar diagrama">⤢</button>
            </div>

            <div class="statusbar__right">
                <span class="statusbar__badge" id="bpmn-badge" title="Compatibilidade BPMN 2.0">BPMN 2.0 ✓</span>
                <span class="statusbar__message" id="status-message" aria-live="polite"></span>
            </div>
        </footer>
    </div>

    <!-- ---------- ÁREA DE NOTIFICAÇÕES (toasts) ---------- -->
    <div id="notifications" class="notifications" aria-live="polite" aria-atomic="true"></div>

    <!-- ============================================================
         SCRIPTS
         Ordem importa:
         1. bpmn-js do CDN (define window.BpmnJS)
         2. seus módulos em ordem de dependência
         ============================================================ -->
    <script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-modeler.development.js"></script>

    <script type="module" src="js/ui/notifications.js"></script>
    <script type="module" src="js/ui/statusbar.js"></script>
    <script type="module" src="js/ui/toolbar.js"></script>
    <script type="module" src="js/editor/palette.js"></script>
    <script type="module" src="js/editor/properties.js"></script>
    <script type="module" src="js/editor/modeler.js"></script>
    <script type="module" src="js/io/newDiagram.js"></script>
    <script type="module" src="js/io/exportBpmn.js"></script>
    <script type="module" src="js/io/importBpmn.js"></script>
    <script type="module" src="js/validation/validator.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
